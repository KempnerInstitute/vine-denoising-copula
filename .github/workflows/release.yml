name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag and package version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          assert pathlib.Path(f'docs/releases/RELEASE_NOTES_v{version}.md').is_file()
          PY
      - name: Install dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,data]' build
      - name: Test and build
        run: |
          python -m pytest tests
          python -m build
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Verify installed wheel outside the checkout
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/vdc-wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/vdc-wheel/bin/python" -m pip install --ignore-installed --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          "$RUNNER_TEMP/vdc-wheel/bin/python" -I - <<'PY'
          import sys
          from pathlib import Path
          import vdc
          from vdc import VineCopulaModel
          from vdc.data.mixtures import MixtureCopula
          assert Path(vdc.__file__).is_relative_to(Path(sys.prefix))
          print("Installed wheel:", vdc.__version__, vdc.__file__)
          PY
          "$RUNNER_TEMP/vdc-wheel/bin/vdc" list-models
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/releases/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
