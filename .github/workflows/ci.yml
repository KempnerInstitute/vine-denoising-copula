name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run Ruff on maintained paths
        run: |
          ruff check \
            vdc/pretrained.py \
            vdc/utils/ipfp_log.py \
            vdc/utils/probit_transform.py \
            scripts/build_docs_site.py \
            scripts/download_pretrained.py \
            scripts/package_pretrained_model.py \
            scripts/upload_pretrained_to_hf.py \
            examples/use_pretrained_model.py \
            tests/test_information_metrics.py \
            tests/test_pretrained.py \
            tests/test_histogram_normalization.py \
            tests/test_model_factory.py \
            scripts/check_installation.py \
            scripts/verify_index_release.py \
            vdc/models/factory.py \
            examples/diagnostics/histogram_normalization/reproduce.py \
            tests/test_ipfp_log.py \
            tests/test_probit_transform.py \
            tests/test_hfunc_independence_accuracy.py \
            vdc/models/linear_grid_copula.py \
            vdc/models/linear_grid_estimator.py \
            vdc/data/continuous_mixtures.py \
            vdc/train/linear_grid_pretraining.py \
            vdc/train/linear_grid_training.py \
            scripts/train_linear_grid_estimator.py \
            tests/test_continuous_mixtures.py \
            tests/test_linear_grid_copula.py \
            tests/test_linear_grid_estimator.py \
            tests/test_linear_grid_pretraining.py \
            tests/test_linear_grid_training.py \
            tests/test_pretrained_linear_grid.py \
            tests/test_vine_linear_grid.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,train,data,viz]' build
      - name: Run complete library test suite
        run: python -m pytest tests --junitxml=test-results.xml
      - name: Build wheel and source distribution
        run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python }}
          path: test-results.xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          python -m pip install pytest
      - name: Verify documentation links
        run: python -m pytest tests/test_docs.py
      - name: Build documentation
        run: python scripts/build_docs_site.py --out-dir site

  minimal-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and check dependencies
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vdc
          key: ${{ runner.os }}-released-models-${{ hashFiles('vdc/resources/pretrained/*.json') }}
      - name: Exercise installed inference without training dependencies
        working-directory: ${{ runner.temp }}
        run: |
          model_flags=()
          if [[ "$RUNNER_OS" == Linux ]]; then model_flags+=(--all-models); fi
          python -I "$GITHUB_WORKSPACE/scripts/check_installation.py" --require-minimal "${model_flags[@]}" --output "$GITHUB_WORKSPACE/installed-model.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-install-${{ matrix.os }}
          path: installed-model.json
