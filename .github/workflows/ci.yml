name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run Ruff on maintained paths
        run: |
          ruff check \
            vdc/pretrained.py \
            vdc/utils/ipfp_log.py \
            vdc/utils/probit_transform.py \
            scripts/build_docs_site.py \
            scripts/download_pretrained.py \
            scripts/package_pretrained_model.py \
            scripts/upload_pretrained_to_hf.py \
            examples/use_pretrained_model.py \
            tests/test_information_metrics.py \
            tests/test_pretrained.py \
            tests/test_ipfp_log.py \
            tests/test_probit_transform.py \
            tests/test_hfunc_independence_accuracy.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,data]' build
      - name: Run complete library test suite
        run: python -m pytest tests --junitxml=test-results.xml
      - name: Build wheel and source distribution
        run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python }}
          path: test-results.xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          python -m pip install pytest
      - name: Verify documentation links
        run: python -m pytest tests/test_docs.py
      - name: Build documentation
        run: python scripts/build_docs_site.py --out-dir site
